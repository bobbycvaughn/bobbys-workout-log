<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13243a">
<title>Bobby’s Workout Log</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script defer src="app.js"></script>
</head>
<body>
<header><h1>Bobby’s Workout Log</h1><p>Three days · Full body</p></header>
<nav aria-label="Views">
<button data-tab="workout">Workout</button><button data-tab="history">History</button><button data-tab="progress">Progress</button>
</nav>
<main id="view"></main>
<footer><p>Saved in this browser on this device. Clearing site data, private browsing, or switching devices can remove access to your logs.</p><button id="export">Export workout data</button> <button id="import">Restore backup</button><input hidden type="file" id="backup" accept=".json,application/json"><p id="status" role="status"></p></footer>
<dialog id="form-guide" aria-labelledby="form-title"><h2 id="form-title"></h2><p></p><p><a id="form-video" target="_blank" rel="noopener noreferrer">Find a demo on YouTube ↗</a></p><form method="dialog"><button>Done</button></form></dialog>
<aside id="rest" aria-label="Rest timer" hidden>
  <div class="rest-heading"><strong></strong><output aria-live="off"></output></div>
  <div class="rest-controls">
    <button data-rest="60">60s</button><button data-rest="90">90s</button>
    <button data-rest="120">120s</button><button id="rest-close">Dismiss</button>
  </div>
</aside>
<dialog id="finish-summary" aria-labelledby="finish-title">
<h2 id="finish-title">Workout summary</h2><p></p><h3></h3><ul></ul>
<form method="dialog"><button>Done</button></form></dialog>
</body>
</html>
