<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111514">
<title>Crunch Workout Log</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script defer src="app.js"></script>
</head>
<body>
<header><div class="brand"><span aria-hidden="true">✦</span> CRUNCH WORKOUT LOG</div><h1>Training log</h1><p>Three days · Full body</p></header>
<nav aria-label="Views">
<button data-tab="workout">Workout</button><button data-tab="history">History</button><button data-tab="progress">Progress</button>
</nav>
<main id="view"></main>
<footer><p>Saved in this browser on this device. Clearing site data, private browsing, or switching devices can remove access to your logs.</p><button id="export">Export workout data</button> <button id="import">Restore backup</button><input hidden type="file" id="backup" accept=".json,application/json"><p id="status" role="status"></p></footer>
</body>
</html>
